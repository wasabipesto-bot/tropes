[project]
name = "tropes-worker"
version = "0.0.0"
description = "Trope Log pipeline worker: runs next to the media library and talks to the site over its job API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openai>=1.60",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pillow>=13.0.0",
]

[project.scripts]
tropes-worker = "tropes_worker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tropes_worker"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
